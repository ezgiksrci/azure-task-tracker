trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
# 1. Build & Package
- stage: Build
  displayName: Build & Package
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish (zip)
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop

# 2. Deploy to Staging Slot
- stage: Deploy_Staging
  displayName: Deploy to Staging Slot
  dependsOn: Build
  variables:
    - group: vg-prod
  jobs:
  - deployment: WebApp_Staging
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to $(AZ_APP_NAME) (Staging Slot)
            inputs:
              azureSubscription: 'AzureTaskTracker-ServiceConnection'
              appType: 'webApp'
              appName: '$(AZ_APP_NAME)'
              slotName: 'staging'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'

          # EF Core CLI yükleme
          - script: dotnet tool install --global dotnet-ef --version 8.*
            displayName: Install dotnet-ef tool
            env:
              PATH: $(PATH):$(USERPROFILE)\.dotnet\tools

          # EF Core Migration (workingDirectory ile)
          - task: DotNetCoreCLI@2
            displayName: Run EF Migrations on Staging
            inputs:
              command: custom
              custom: ef
              arguments: database update
              workingDirectory: $(System.DefaultWorkingDirectory)

          # Staging Smoke Test
          - script: |
              echo "Running smoke test on staging..."
              CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$(AZ_APP_NAME)-staging.azurewebsites.net/swagger/index.html)
              echo "HTTP: $CODE"
              if [ "$CODE" -ne 200 ]; then
                echo "Smoke test failed. Stopping pipeline."
                exit 1
              fi
            displayName: 'Smoke Test (Staging)'

# 3. Swap to Production
- stage: Swap_To_Prod
  displayName: Swap Staging to Production
  dependsOn: Deploy_Staging
  variables:
    - group: vg-prod
  jobs:
  - job: Swap
    steps:
    - task: AzureAppServiceManage@0
      displayName: Swap Slots (Staging -> Prod)
      inputs:
        azureSubscription: 'AzureTaskTracker-ServiceConnection'
        WebAppName: '$(AZ_APP_NAME)'
        ResourceGroupName: '$(AZ_RESOURCE_GROUP)'
        SourceSlot: 'staging'
        SwapWithProduction: true
