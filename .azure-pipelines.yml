trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  - name: buildConfiguration
    value: Release
  # Connection string, app name, resource group vb. için
  - group: vg-prod

stages:
# 1) Build, Migrate & Package
- stage: Build
  displayName: Build, Run Migration & Package
  jobs:
  - job: BuildAndMigrate
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.x

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # ---- EF Core Migrations ----
    # Neden PS? Windows ajanında PATH güncellemesini güvenilir yapmak için.
    - task: PowerShell@2
      displayName: Run EF Migrations (Build Stage)
      inputs:
        targetType: inline
        workingDirectory: '$(System.DefaultWorkingDirectory)/AzureTaskTracker'
        script: |
          $ErrorActionPreference = 'Stop'

          # EF CLI kurulum + PATH
          dotnet tool install --global dotnet-ef --version 8.* | Out-Host
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"

          dotnet --info | Out-Host
          dotnet ef --version | Out-Host

          if (-not $env:AZ_SQL_CONN) {
            throw 'AZ_SQL_CONN is not set. Add it in variable group vg-prod.'
          }

          # Verbose ile ayrıntılı log
          dotnet ef database update --connection "$env:AZ_SQL_CONN" -v

    - task: DotNetCoreCLI@2
      displayName: Publish (zip)
      inputs:
        command: publish
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop

# 2) Deploy to Staging Slot
- stage: Deploy_Staging
  displayName: Deploy to Staging Slot
  dependsOn: Build
  jobs:
  - deployment: WebApp_Staging
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to $(AZ_APP_NAME) (Staging Slot)
            inputs:
              azureSubscription: AzureTaskTracker-ServiceConnection
              appType: webApp
              appName: '$(AZ_APP_NAME)'
              slotName: staging
              package: '$(Pipeline.Workspace)/drop/**/*.zip'

          # Staging Smoke Test (Windows ajanında Bash kullan)
          - task: Bash@3
            displayName: Smoke Test (Staging)
            inputs:
              targetType: inline
              script: |
                echo "Running smoke test on staging..."
                CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$(AZ_APP_NAME)-staging.azurewebsites.net/swagger/index.html)
                echo "HTTP: $CODE"
                if [ "$CODE" -ne 200 ]; then
                  echo "Smoke test failed. Stopping pipeline."
                  exit 1
                fi

# 3) Swap to Production
- stage: Swap_To_Prod
  displayName: Swap Staging to Production
  dependsOn: Deploy_Staging
  jobs:
  - job: Swap
    steps:
    - task: AzureAppServiceManage@0
      displayName: Swap Slots (Staging -> Prod)
      inputs:
        azureSubscription: AzureTaskTracker-ServiceConnection
        WebAppName: '$(AZ_APP_NAME)'
        ResourceGroupName: '$(AZ_RESOURCE_GROUP)'
        SourceSlot: staging
        SwapWithProduction: true
