trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
# 1) Build, Migration & Package
- stage: Build
  displayName: Build, Run Migration & Package
  variables:
    - group: vg-prod   # AZURE_SQL_CONNECTION_STRING burada tanımlı olmalı (secret)
  jobs:
  - job: BuildAndMigrate
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # EF Core Migration - İyileştirilmiş hata yönetimi ile
    - task: PowerShell@2
      displayName: Run EF Migrations (Build Stage)
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/AzureTaskTracker'
        errorActionPreference: 'stop'
        ignoreLASTEXITCODE: false
        script: |
          # Hata ayıklama için verbose output
          $VerbosePreference = "Continue"
          $ErrorActionPreference = "Stop"
          
          Write-Host "=== EF Core Migration Başlıyor ==="
          Write-Host "Working Directory: $(Get-Location)"
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          
          try {
            # .NET EF tool kurulumu - önce kontrol et
            Write-Host "Checking if dotnet-ef is already installed..."
            $efInstalled = dotnet tool list --global | Select-String "dotnet-ef"
            
            if (-not $efInstalled) {
              Write-Host "Installing dotnet-ef tool..."
              dotnet tool install --global dotnet-ef --version 8.*
              if ($LASTEXITCODE -ne 0) {
                throw "dotnet-ef tool installation failed with exit code: $LASTEXITCODE"
              }
            } else {
              Write-Host "dotnet-ef already installed: $efInstalled"
            }
            
            # PATH güncelleme
            Write-Host "Updating PATH..."
            $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
            Write-Host "Current PATH: $env:PATH"
            
            # EF tool version kontrolü
            Write-Host "Verifying EF tool installation..."
            dotnet ef --version
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet-ef verification failed with exit code: $LASTEXITCODE"
            }
            
            # Connection string kontrolü
            Write-Host "Checking connection string..."
            $conn = "$(AZURE_SQL_CONNECTION_STRING)"
            Write-Host "Connection string length: $($conn.Length)"
            
            if ([string]::IsNullOrWhiteSpace($conn) -or $conn -like '$(*') {
              throw "AZURE_SQL_CONNECTION_STRING tanımlı değil veya değer atanmamış. Library > Variable groups > vg-prod içinde secret olarak ekleyin."
            }
            
            # Proje dosyası kontrolü
            Write-Host "Checking for .csproj files..."
            $csprojFiles = Get-ChildItem -Name "*.csproj"
            Write-Host "Found .csproj files: $csprojFiles"
            
            # DbContext kontrolü
            Write-Host "Checking for DbContext..."
            $contextFiles = Get-ChildItem -Recurse -Name "*Context.cs" -ErrorAction SilentlyContinue
            Write-Host "Found DbContext files: $contextFiles"
            
            # Migration dosyalarını kontrol et
            Write-Host "Checking for existing migrations..."
            if (Test-Path "Migrations") {
              $migrations = Get-ChildItem "Migrations" -Name "*.cs" | Where-Object { $_ -notlike "*Designer.cs" }
              Write-Host "Found migrations: $migrations"
            } else {
              Write-Host "No Migrations folder found"
            }
            
            # Database update çalıştır
            Write-Host "Running database update..."
            dotnet ef database update --connection "$conn" --verbose
            
            if ($LASTEXITCODE -ne 0) {
              throw "EF database update failed with exit code: $LASTEXITCODE"
            }
            
            Write-Host "=== EF Core Migration Tamamlandı ==="
            
          } catch {
            Write-Error "Migration failed: $($_.Exception.Message)"
            Write-Host "Exception Details:"
            Write-Host $_.Exception.ToString()
            Write-Host "Stack Trace:"
            Write-Host $_.ScriptStackTrace
            exit 1
          }

    - task: DotNetCoreCLI@2
      displayName: Publish (zip)
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop

# 2) Deploy to Staging Slot
- stage: Deploy_Staging
  displayName: Deploy to Staging Slot
  dependsOn: Build
  variables:
    - group: vg-prod
  jobs:
  - deployment: WebApp_Staging
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to $(AZ_APP_NAME) (Staging Slot)
            inputs:
              azureSubscription: 'AzureTaskTracker-ServiceConnection'
              appType: 'webApp'
              appName: '$(AZ_APP_NAME)'
              slotName: 'staging'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'

          # PowerShell ile smoke test (Windows agent için)
          - task: PowerShell@2
            displayName: 'Smoke Test (Staging)'
            inputs:
              targetType: 'inline'
              script: |
                try {
                  Write-Host "Running smoke test on staging..."
                  $url = "https://$(AZ_APP_NAME)-staging.azurewebsites.net/swagger/index.html"
                  Write-Host "Testing URL: $url"
                  
                  # Retry logic ile test
                  $maxRetries = 3
                  $retryDelay = 30
                  
                  for ($i = 1; $i -le $maxRetries; $i++) {
                    try {
                      Write-Host "Attempt $i of $maxRetries..."
                      $response = Invoke-WebRequest -Uri $url -TimeoutSec 60 -UseBasicParsing
                      $statusCode = $response.StatusCode
                      Write-Host "HTTP Status Code: $statusCode"
                      
                      if ($statusCode -eq 200) {
                        Write-Host "Smoke test passed!"
                        break
                      }
                    } catch {
                      Write-Host "Attempt $i failed: $($_.Exception.Message)"
                      if ($i -eq $maxRetries) {
                        throw "Smoke test failed after $maxRetries attempts"
                      }
                      Write-Host "Waiting $retryDelay seconds before retry..."
                      Start-Sleep -Seconds $retryDelay
                    }
                  }
                } catch {
                  Write-Error "Smoke test failed: $($_.Exception.Message)"
                  exit 1
                }

# 3) Swap to Production
- stage: Swap_To_Prod
  displayName: Swap Staging to Production
  dependsOn: Deploy_Staging
  variables:
    - group: vg-prod
  jobs:
  - job: Swap
    steps:
    - task: AzureAppServiceManage@0
      displayName: Swap Slots (Staging -> Prod)
      inputs:
        azureSubscription: 'AzureTaskTracker-ServiceConnection'
        WebAppName: '$(AZ_APP_NAME)'
        ResourceGroupName: '$(AZ_RESOURCE_GROUP)'
        SourceSlot: 'staging'
        SwapWithProduction: true